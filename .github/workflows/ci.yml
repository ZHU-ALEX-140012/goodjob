name: CI

# 三段证明：
#   1) 离线单测（unittest，无需 LLM 密钥、不联网 —— 规则引擎的可测性就是卖点）
#   2) 起真实 uvicorn 探 /health 和 /tags（证明"装了就能跑"，不是只过了 mock）
#   3) docker build 成功（证明 Dockerfile 与 .dockerignore 与代码同步演进）

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (offline, no LLM keys required)
        run: python -m unittest -v test_single_route_backend

      - name: Smoke test - real server must answer /health and /tags
        run: |
          python main.py > server.out.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then echo "--- server log ---"; cat server.out.log; exit 1; fi
          curl -sf http://127.0.0.1:8000/health
          echo
          curl -sf http://127.0.0.1:8000/tags
          echo
          kill $PID

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t goodjob:ci .

      - name: Container smoke
        run: |
          docker run -d --rm --name goodjob-smoke -p 8000:8000 goodjob:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs goodjob-smoke
          exit 1
